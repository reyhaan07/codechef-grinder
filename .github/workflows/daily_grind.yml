name: CodeChef Practice Auto-Grinder

on:
  schedule:
    # Sprint mode: every hour at :23 (GitHub may start scheduled runs late).
    # Up to 25 problems per run x 24 runs, capped at 600/day (~1 submission per minute,
    # never in bursts). Lower DAILY_TARGET_MAX / MAX_PROBLEMS_PER_RUN to slow down.
    - cron: '23 * * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions

permissions:
  contents: write
  actions: write   # lets a finished run start the next one (sprint chaining)

concurrency:
  group: grind-and-commit
  cancel-in-progress: false

jobs:
  grind-and-commit:
    runs-on: ubuntu-latest
    # A run that hangs is killed long before the next hourly run is due.
    timeout-minutes: 55
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CodeChef Practice Grinder (Randomized Mode)
        id: grind
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CODECHEF_SESSION: ${{ secrets.CODECHEF_SESSION }}
          # CodeChef handle that owns CODECHEF_SESSION. The solved database is bound to it,
          # so a database copied from another account (e.g. via a fork) is archived, not reused.
          # Override with a repository variable named CODECHEF_USERNAME if you fork this repo.
          CODECHEF_USERNAME: ${{ vars.CODECHEF_USERNAME || 'reyhaan_s' }}
          VERDICT_TIMEOUT_SECONDS: "120"
          # Stop starting new problems after 45 min so the run always finishes and commits.
          MAX_RUNTIME_MINUTES: "45"
          # Skip the Gemini-written README per problem (halves Gemini requests during the sprint).
          # Set back to "true" afterwards to get full explanations again.
          GENERATE_EXPLANATIONS: "false"
          RANDOMIZE_BATCH: "true"
          MIN_PROBLEMS_PER_RUN: "18"
          MAX_PROBLEMS_PER_RUN: "25"
          DAILY_TARGET_MIN: "400"
          DAILY_TARGET_MAX: "600"
          MIN_DELAY_SECONDS: "20"
          MAX_DELAY_SECONDS: "45"
          LANGUAGE: "cpp"
          MIN_DIFFICULTY: "200"
          MAX_DIFFICULTY: "1400"
        run: |
          python -m src.runner

      - name: Native Activity Heartbeat (Keepalive)
        if: always()
        run: |
          mkdir -p data
          # Update a timestamp if no commits occurred in the last 40 days
          LAST_COMMIT_DATE=$(git log -1 --format=%ct)
          CURRENT_DATE=$(date +%s)
          DIFF_DAYS=$(( (CURRENT_DATE - LAST_COMMIT_DATE) / 86400 ))
          if [ $DIFF_DAYS -ge 40 ]; then
            date -u +"%Y-%m-%d %H:%M:%S UTC" > data/.keepalive
          fi

      - name: Sync with latest main before committing
        # always(): progress is saved even if the run failed or was cancelled.
        if: always()
        # If main changed during the run (e.g. a merged pull request), replay this run's
        # changes on top of it instead of overwriting it.
        run: |
          git config user.name "CodeChef Grinder Bot"
          git config user.email "actions@github.com"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"

      - name: Commit & Push Solved Solutions
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto: Grinded CodeChef Practice Problems [skip ci]"
          file_pattern: "."
          commit_user_name: "CodeChef Grinder Bot"
          commit_user_email: "actions@github.com"
          commit_author: "CodeChef Grinder Bot <actions@github.com>"

      - name: Start the next run (sprint chaining)
        # Starts another run immediately while problems are being solved, instead of
        # waiting for the hourly schedule. Stops by itself when the daily cap is hit,
        # nothing was solved, or Gemini quota ran out. Set the repository variable
        # SPRINT_CHAIN to "false" to switch this off.
        if: success() && steps.grind.outputs.continue == 'true' && vars.SPRINT_CHAIN != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run daily_grind.yml --repo "${GITHUB_REPOSITORY}" --ref "${GITHUB_REF_NAME}"
